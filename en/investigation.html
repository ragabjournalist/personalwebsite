<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investigation — Ahmed Ragab</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    .article-wrap{max-width:920px;margin:0 auto;padding:3rem 2rem 5rem}
    .article-head{margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid #e5dfd3}
    .article-head .eyebrow{color:#a01818;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;font-weight:600;margin-bottom:1rem}
    .article-head h1{font-family:"Playfair Display",serif;font-size:clamp(1.75rem,3.5vw,2.75rem);line-height:1.25;margin-bottom:1rem;color:#1a1a1a}
    .article-head .meta{color:#666;font-size:.95rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .article-head .meta .sep{color:#c9c1b0}
    .hero-media{margin:2rem 0 3rem}
    .hero-media img{width:100%;max-height:520px;object-fit:cover;border-radius:2px;display:block}
    .hero-media figcaption{color:#666;font-size:.85rem;margin-top:.75rem;font-style:italic}
    .article-body{font-family:"EB Garamond",serif;font-size:1.25rem;line-height:1.75;color:#1a1a1a}
    .article-body p{margin-bottom:1.5rem}
    .article-body p:first-of-type::first-letter{
      font-family:"Playfair Display",serif;font-size:3.75rem;font-weight:700;color:#a01818;
      float:left;line-height:1;margin-inline-end:.5rem;margin-top:.3rem
    }
    .article-cta{margin:3rem 0;padding:2rem;background:#fff;border:1px solid #e5dfd3;border-radius:2px;text-align:center}
    .article-cta p{color:#666;margin-bottom:1rem}
    .gallery-section{margin:3rem 0}
    .gallery-section h3{font-family:"Playfair Display";font-size:1.35rem;margin-bottom:1.25rem;padding-bottom:.5rem;border-bottom:2px solid #a01818;display:inline-block}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .gallery-grid figure{margin:0}
    .gallery-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px;cursor:zoom-in;transition:opacity .2s}
    .gallery-grid img:hover{opacity:.85}
    .gallery-grid figcaption{color:#666;font-size:.85rem;margin-top:.5rem;font-style:italic}
    .back-link{color:#a01818;text-decoration:none;font-weight:500;font-size:.95rem;display:inline-flex;align-items:center;gap:.5rem;margin-bottom:2rem}
    .back-link:hover{text-decoration:underline}
    .not-found{text-align:center;padding:5rem 2rem}
    .not-found h2{font-family:"Playfair Display";margin-bottom:1rem}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:1000;padding:2rem;cursor:zoom-out}
    .lightbox.open{display:flex}
    .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
    @media (max-width:640px){
      .article-body{font-size:1.15rem}
      .article-wrap{padding:2rem 1.25rem 3rem}
    }
  </style>
</head>
<body class="lang-en">
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="#" class="lang-switch" id="lang-switch">AR</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="investigations.html" class="active">Investigations</a></li>
        <li><a href="podcasts.html">Podcasts</a></li>
        <li><a href="books.html">Books</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <a href="index.html" class="brand-mark">Ahmed Ragab</a>
    </div>
  </nav>

  <main>
    <article class="article-wrap" id="article">
      <div class="loading" style="text-align:center;padding:5rem;color:#666">Loading...</div>
    </article>
  </main>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img /></div>

  <footer>
    <div class="footer-inner">
      <p>Investigative journalist.</p>
    </div>
  </footer>

  <script>
  const API_BASE = window.location.hostname === 'localhost' || window.location.hostname.startsWith('127.')
    ? 'http://localhost:8787'
    : ''; // same-origin in production

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function paragraphs(text) {
    if (!text) return '';
    return String(text).split(/\n{2,}/).map(p => `<p>${escapeHtml(p.trim()).replace(/\n/g,'<br>')}</p>`).join('');
  }

  async function loadInvestigation() {
    const slug = new URLSearchParams(location.search).get('slug');
    const wrap = document.getElementById('article');
    if (!slug) {
      wrap.innerHTML = '<div class="not-found"><h2>No investigation specified</h2><a class="back-link" href="investigations.html">← Back to investigations</a></div>';
      return;
    }
    try {
      const r = await fetch(`${API_BASE}/api/investigations/${encodeURIComponent(slug)}`);
      if (r.status === 404) throw new Error('not-found');
      if (!r.ok) throw new Error(r.status);
      const inv = await r.json();
      document.title = (inv.title_en || inv.title_ar || 'Investigation') + ' — Ahmed Ragab';
      document.getElementById('lang-switch').href = '../investigation.html?slug=' + encodeURIComponent(inv.slug);

      const dateStr = inv.date || inv.year || '';
      const pub = inv.publication_en || inv.publication_ar || '';
      const title = inv.title_en || inv.title_ar || '';
      const hero = inv.hero_image
        ? `<figure class="hero-media"><img src="${escapeHtml(inv.hero_image)}" alt="${escapeHtml(title)}" /></figure>`
        : '';
      const body = inv.body_en
        ? `<div class="article-body">${paragraphs(inv.body_en)}</div>`
        : `<div class="article-body"><p style="color:#888;font-style:italic;font-family:'Inter',sans-serif;font-size:1rem">The full text is available at the original source.</p></div>`;

      const gallery = (inv.gallery && inv.gallery.length > 1) ? `
        <section class="gallery-section">
          <h3>Gallery</h3>
          <div class="gallery-grid">
            ${inv.gallery.map(g => `
              <figure>
                <img src="${escapeHtml(g.url)}" alt="${escapeHtml(g.caption_en||g.caption_ar||'')}" onclick="openLightbox('${escapeHtml(g.url)}')" />
                ${(g.caption_en||g.caption_ar) ? `<figcaption>${escapeHtml(g.caption_en||g.caption_ar)}</figcaption>` : ''}
              </figure>
            `).join('')}
          </div>
        </section>
      ` : '';

      const cta = inv.source_url ? `
        <div class="article-cta">
          <p>This investigation was originally published in ${escapeHtml(pub || 'the original source')}.</p>
          <a href="${escapeHtml(inv.source_url)}" target="_blank" rel="noopener" class="btn primary">Read the original ↗</a>
        </div>
      ` : '';

      wrap.innerHTML = `
        <a href="investigations.html" class="back-link">← Back to investigations</a>
        <div class="article-head">
          <div class="eyebrow">Investigation</div>
          <h1>${escapeHtml(title)}</h1>
          <div class="meta">
            ${dateStr ? `<span>${escapeHtml(dateStr)}</span>` : ''}
            ${dateStr && pub ? '<span class="sep">·</span>' : ''}
            ${pub ? `<span>${escapeHtml(pub)}</span>` : ''}
          </div>
        </div>
        ${hero}
        ${body}
        ${gallery}
        ${cta}
      `;
    } catch(e) {
      if (String(e.message).includes('not-found')) {
        wrap.innerHTML = '<div class="not-found"><h2>Investigation not found</h2><a class="back-link" href="investigations.html">← Back to investigations</a></div>';
      } else {
        wrap.innerHTML = '<div class="not-found"><h2 style="color:#a01818">Failed to load</h2><p style="color:#666">Try again later.</p><a class="back-link" href="investigations.html">← Back to investigations</a></div>';
      }
      console.error(e);
    }
  }

  function openLightbox(url) {
    const lb = document.getElementById('lightbox');
    lb.querySelector('img').src = url;
    lb.classList.add('open');
  }

  loadInvestigation();
  </script>
</body>
</html>
